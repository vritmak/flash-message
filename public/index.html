<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashMessage - Real-Time Feed</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .container { max-width: 600px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 1rem; }
        .status { padding: 4px 10px; border-radius: 999px; font-size: 0.85rem; font-weight: bold; background: #ef4444; color: white; }
        .status.connected { background: #22c55e; }
        .feed { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
        .card { background: #1e293b; border: 1px solid #334155; border-left: 4px solid #38bdf8; border-radius: 8px; padding: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.2); animation: fadeIn 0.3s ease-in-out; }
        .card-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.4rem; }
        .badge { background: #0284c7; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>⚡ FlashMessage Live Feed</h2>
            <div id="statusBadge" class="status">Connecting...</div>
        </div>
        <p style="color: #94a3b8;">Logged in as: <strong>User 1 (johndoe)</strong></p>
        <div class="feed" id="feed">
            <p id="emptyMsg" style="color: #64748b;">Waiting for new notifications from workers...</p>
        </div>
    </div>

    <script>
        const socket = io();
        const statusBadge = document.getElementById('statusBadge');
        const feed = document.getElementById('feed');
        const emptyMsg = document.getElementById('emptyMsg');

        socket.on('connect', () => {
            statusBadge.textContent = '● Live Connected';
            statusBadge.classList.add('connected');
            // Register this browser connection as User 1
            socket.emit('register_user', 1);
        });

        socket.on('disconnect', () => {
            statusBadge.textContent = 'Disconnected';
            statusBadge.classList.remove('connected');
        });

        socket.on('notification_received', (data) => {
            if (emptyMsg) emptyMsg.remove();

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="badge">${data.type.toUpperCase()}</span>
                    <span>${new Date(data.timestamp).toLocaleTimeString()}</span>
                </div>
                <div style="font-size: 1rem;">${data.message}</div>
                <div style="font-size: 0.75rem; color: #22c55e; margin-top: 6px;">Status: ${data.status} (Notification #${data.notificationId})</div>
            `;
            feed.prepend(card);
        });
    </script>
</body>
</html>
